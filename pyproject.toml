[build-system]
requires = ["setuptools==82.0.1"]
# A thin in-tree wrapper around setuptools (`build_backend.py`). It purges a
# stale `build/lib` before every build so the wheel is the working tree, and
# writes `redkraken/_build.json` -- the revision and per-module digests
# `rk doctor` verifies the install against. `backend-path` puts the repo root on
# the build's import path so the frontend can load it.
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "redkraken"
description = "A local-first bug-bounty hunting harness for web and API targets"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]

# The runtime is standard library only. Every entry added here is an exact pin,
# and `rk doctor` verifies the same table at startup.
#
# One thing this application imports is deliberately absent: the Agent SDK, in
# `redkraken/_launch.py`. What it needs is a *pair* -- an SDK version and the
# CLI version that SDK bundles -- which a requirement specifier cannot express,
# so the pair is pinned in `_startup.KNOWN_RUNTIME` and enforced by the startup
# assertion, and an SDK missing here refuses one Agent run rather than every
# `rk` command.
dependencies = []

[project.scripts]
rk = "redkraken.cli:main"

[tool.setuptools.dynamic]
version = { attr = "redkraken.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Named rather than discovered, so anything that later appears beside the
# application under `src` has to be shipped on purpose.
include = ["redkraken*"]

# The schema corpus is part of the application, not a document beside it: `rk db
# migrate` applies the migrations it was installed with rather than whatever is
# in the working directory, so they have to be in the wheel.
[tool.setuptools.package-data]
redkraken = [
    "migrations/*.sql",
    "migrations/README.md",
    "measurements/*.json",
    "skills/*/SKILL.md",
    "skills/*/scripts/*",
    "skills/*/references/*",
    "playbooks/*/playbook.md",
    "playbooks/*/references/*",
    "fixtures/*/fixture.md",
    "fixtures/*/app.py",
    # The build manifest `build_backend.py` writes into the wheel: the revision
    # and per-module digests `rk doctor` and `rk proxy serve` verify against.
    "_build.json",
]
