# Stand-in roster. Ticket 11 owns the real one; this file exists only so the
# validator's R6/R7 have something to check against.
#
# `tools` is the security boundary (AgentDefinition.tools). A skill's
# `allowed-tools` may narrow this set and may never widen it (Q3).
roles:
  hunter:
    tools: [Read, Bash, Glob, Grep]
    # `hunter` stands in for the production roster's `web_hunter` role.
    skills: [probe-alpha, probe-beta, use-identity]
  validator:
    tools: [Read, Grep]
    skills: [probe-alpha]
